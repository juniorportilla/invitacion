<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Invitación Especial</title>

  <meta
    name="description"
    content="Descubre todos los detalles de nuestra invitación."
  >

  <!-- =========================================
       FACEBOOK / WHATSAPP / MESSENGER
       ========================================= -->

  <meta property="og:type" content="website">

  <meta
    property="og:title"
    content="Invitación Especial"
  >

  <meta
    property="og:description"
    content="Descubre todos los detalles de nuestra invitación."
  >

  <meta
    property="og:url"
    content="https://juniorportilla.github.io/invitacion/"
  >

  <meta
    property="og:image"
    content="https://juniorportilla.github.io/invitacion/invitacion.png"
  >

  <meta
    property="og:image:width"
    content="1280"
  >

  <meta
    property="og:image:height"
    content="1168"
  >

  <!-- =========================================
       TWITTER / X
       ========================================= -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Invitación Especial"
  >

  <meta
    name="twitter:description"
    content="Descubre todos los detalles de nuestra invitación."
  >

  <meta
    name="twitter:image"
    content="https://juniorportilla.github.io/invitacion/invitacion.png"
  >

  <!-- =========================================
       ESTILOS
       ========================================= -->

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #111111;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .card {
      width: min(900px, 100%);
      text-align: center;
    }

    .invitation-image {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
    }

    .message {
      margin: 18px 0 0;
      color: #dddddd;
      font-size: 16px;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 16px 32px;
      border-radius: 50px;
      background: linear-gradient(
        135deg,
        #f0c75e,
        #d9aa3b
      );
      color: #111111;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 25px rgba(217, 170, 59, 0.25);
      transition: transform 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .small-text {
      margin-top: 15px;
      color: #888888;
      font-size: 13px;
    }

  </style>
</head>

<body>

  <main class="wrap">

    <div class="card">

      <!-- IMAGEN DE LA INVITACIÓN -->
      <img
        class="invitation-image"
        src="invitacion.png"
        alt="Invitación Especial"
      >

      <!-- MENSAJE -->
      <p class="message">
        Haz clic en el botón para abrir todos los detalles de la invitación.
      </p>

      <!-- BOTÓN HACIA PINTEREST -->
      <a
        class="button"
        href="https://pin.it/6Ua5oeDLo"
        target="_blank"
        rel="noopener noreferrer"
      >
        🔗 VER INVITACIÓN
      </a>

      <p class="small-text">
        Invitación Especial
      </p>

    </div>

  </main>

</body>
</html>
